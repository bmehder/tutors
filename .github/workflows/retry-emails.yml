name: Retry queued email
on:
  schedule:
    # Avoid minute zero, when GitHub documents heavier scheduler load.
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: retry-queued-email
  cancel-in-progress: false
jobs:
  deliver:
    if: vars.EMAIL_RETRIES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Process queued messages and report problems
        env:
          WORKER_SECRET: ${{ secrets.EMAIL_WORKER_SECRET }}
        run: |
          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT
          curl --fail-with-body --silent --show-error --max-time 45 \
            --retry 2 --retry-delay 5 --retry-all-errors \
            -H "Authorization: Bearer $WORKER_SECRET" \
            -H "Content-Type: application/json" --data '{}' \
            --output "$response_file" \
            -X POST https://www.mychristiantutors.com/api/deliver-emails
          python3 - "$response_file" <<'PY'
          import json, sys
          with open(sys.argv[1]) as response:
              status = json.load(response)
          counts = {name: status.get(name, 0) for name in ('sent', 'pending', 'failed', 'held', 'drafts', 'needsReview')}
          print(json.dumps(counts))
          if counts['failed'] or counts['needsReview']:
              print('::error::Email messages need attention. Check the private Operations screen and Resend before retrying uncertain sends.')
              sys.exit(1)
          PY
